{% extends "base.html" %}
{% block titre %}{{ titre_page }}{% endblock %}
{% block contenu %}
<div class="card mx-auto" style="max-width:760px"><div class="card-body p-4">
  <h1 class="h5 mb-4">{{ titre_page }}</h1>
  <form method="post">{% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}{% include "partials/champ.html" with field=field %}{% endfor %}
    <div class="d-flex gap-2"><button class="btn btn-ang"><i class="bi bi-check2"></i> Enregistrer</button>
      <a class="btn btn-outline-secondary" href="javascript:history.back()">Annuler</a></div>
  </form>
</div></div>
{% endblock %}
