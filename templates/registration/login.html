{% extends "base.html" %}{% load static %}
{% block titre %}Connexion{% endblock %}
{% block contenu %}
<div class="card login-card mx-auto mt-4"><div class="card-body p-4">
  <div class="text-center mb-4">
    <img src="{% static APP_LOGO %}" alt="Logo {{ APP_SIGLE }}" style="height:110px">
    <h1 class="h5 mt-3 mb-0">Gestion des besoins en matériels et consommables</h1>
    <div class="text-muted small">{{ APP_INSTITUTION }}</div>
  </div>
  {% if form.errors %}<div class="alert alert-danger py-2">Identifiant ou mot de passe incorrect.</div>{% endif %}
  <form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}">
    <div class="mb-3"><label class="form-label" for="id_username">Identifiant</label>
      <input class="form-control" type="text" name="username" id="id_username" autofocus required autocomplete="username"></div>
    <div class="mb-3"><label class="form-label" for="id_password">Mot de passe</label>
      <input class="form-control" type="password" name="password" id="id_password" required autocomplete="current-password"></div>
    <button class="btn btn-ang w-100"><i class="bi bi-box-arrow-in-right"></i> Se connecter</button>
  </form>
</div></div>
{% endblock %}
