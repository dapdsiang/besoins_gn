{% extends "base.html" %}
{% block titre %}Mot de passe{% endblock %}
{% block contenu %}
<div class="card mx-auto" style="max-width:520px"><div class="card-body p-4">
  <h1 class="h5 mb-3">Changer le mot de passe</h1>
  <form method="post">{% csrf_token %}
    {% for field in form %}{% include "partials/champ.html" with field=field %}{% endfor %}
    <button class="btn btn-ang">Enregistrer</button>
  </form>
</div></div>
{% endblock %}
