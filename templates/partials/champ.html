{% if field.field.widget.input_type == "checkbox" %}
<div class="form-check mb-3">{{ field }} <label class="form-check-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
  {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}</div>
{% else %}
<div class="mb-3">
  <label class="form-label fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="text-danger">*</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
  {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
</div>
{% endif %}
