{% if page.paginator.num_pages > 1 %}
<nav><ul class="pagination justify-content-center mb-0">
  {% if page.has_previous %}<li class="page-item"><a class="page-link" href="?{{ params }}&page={{ page.previous_page_number }}">«</a></li>{% endif %}
  <li class="page-item disabled"><span class="page-link">Page {{ page.number }} / {{ page.paginator.num_pages }}</span></li>
  {% if page.has_next %}<li class="page-item"><a class="page-link" href="?{{ params }}&page={{ page.next_page_number }}">»</a></li>{% endif %}
</ul></nav>
{% endif %}
